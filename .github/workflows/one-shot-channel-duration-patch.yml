name: One-shot channel duration patch

on:
  push:
    branches:
      - agent/channel-duration-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/channel-duration-fix
      - name: Honor runtime duration overrides for channels
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/server/game/Spells/Spell.cpp")
          text = path.read_text(encoding="utf-8")
          old = "        int32 duration = m_spellInfo->GetDuration();\n"
          new = (
              "        // Script/runtime duration overrides must also drive the channel timer.\n"
              "        int32 duration = m_spellValue->AuraDuration != 0\n"
              "            ? m_spellValue->AuraDuration\n"
              "            : m_spellInfo->GetDuration();\n"
          )

          if new in text:
              print("Spell.cpp already honors the runtime channel duration override.")
          else:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one channel duration source line, found {count}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit core change
        run: |
          if git diff --quiet -- src/server/game/Spells/Spell.cpp; then
            echo "No source change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/game/Spells/Spell.cpp
          git commit -m "Honor profiled duration for channeled spells"
          git push origin HEAD:agent/channel-duration-fix
