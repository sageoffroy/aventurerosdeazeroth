name: SpellDraft tooling

on:
  push:
    branches:
      - "agent/**"
    paths:
      - "modules/mod-spelldraft/**"
      - "data/sql/updates/pending_db_world/**"
      - "data/sql/updates/pending_db_characters/**"
      - "src/server/shared/SharedDefines.h"
      - "src/server/shared/enuminfo_SharedDefines.cpp"
      - "src/server/game/Entities/Unit/StatSystem.cpp"
      - ".github/workflows/spelldraft-tooling.yml"
  pull_request:
    paths:
      - "modules/mod-spelldraft/**"
      - "data/sql/updates/pending_db_world/**"
      - "data/sql/updates/pending_db_characters/**"
      - "src/server/shared/SharedDefines.h"
      - "src/server/shared/enuminfo_SharedDefines.cpp"
      - "src/server/game/Entities/Unit/StatSystem.cpp"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SpellDraft bootstrap assets
        run: python3 modules/mod-spelldraft/tools/validate_repo_assets.py

      - name: Lint pending SQL
        run: |
          # AzerothCore's linter compares against origin/master. This fork uses
          # main, so point origin at the canonical core only for the lint step.
          git remote set-url origin https://github.com/azerothcore/azerothcore-wotlk.git
          python3 apps/codestyle/codestyle-sql.py
